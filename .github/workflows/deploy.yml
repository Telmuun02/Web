# master руу push хийх бүрд frontend build хийж, D1 migration ажиллуулаад Cloudflare руу deploy хийнэ
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:        # GitHub дээрээс гараар ажиллуулах товч

concurrency: deploy         # хоёр push зэрэг ирвэл дараалуулна

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - run: npm ci
        working-directory: backend
      - run: npx wrangler d1 migrations apply sukh-hub-asia --remote
        working-directory: backend
      - run: npx wrangler deploy
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0191cb3eee4975c4fc6c54757bc5eb0d
